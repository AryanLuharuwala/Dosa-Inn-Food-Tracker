name: Deploy to Azure Web App

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}   # set in repo → Settings → Variables → Actions

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
        run: npm run build

      # Copy public/ and static assets into the standalone bundle
      - name: Assemble standalone package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      # Azure expects a start command; we wire it via a tiny startup script
      - name: Write startup script
        run: |
          cat > .next/standalone/startup.sh << 'EOF'
          #!/bin/sh
          exec node server.js
          EOF
          chmod +x .next/standalone/startup.sh

      - name: Zip standalone for deploy
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip . -x "*.git*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
