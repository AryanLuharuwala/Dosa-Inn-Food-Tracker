# Retired — replaced by deploy-windows.yml on the restaurant's Windows
# machine. Kept around, manual-trigger-only, in case clawdbot comes back.
name: Deploy to clawdbot (pollys.food)
on:
  workflow_dispatch:
concurrency:
  group: clawdbot-pollys
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [ self-hosted, linux, dosa ]
    steps:
      - name: Build and restart pollys.food
        run: bash $HOME/deploy-dosa.sh
